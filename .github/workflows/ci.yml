name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile scripts/validate_inputs.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Bash syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh
      - name: Validate example samplesheet structure
        run: python scripts/validate_inputs.py --samplesheet config/samplesheet.example.csv --skip-file-checks
